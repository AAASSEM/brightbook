    }

      box-shadow: 0 4px 0 0 #005313;
    }

      box-shadow: 0 0px 0 0 #005313;

    }

<body class="bg-surface-bright font-kid-body-md text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed min-h-screen">
<div class="max-w-[480px] mx-auto min-h-screen flex flex-col px-kid-margin pb-stack-lg">
<header class="flex justify-center items-center py-stack-lg">
<div class="flex flex-col items-center gap-4 text-center">
<div class="relative w-48 h-48 bg-primary-container/20 rounded-full flex items-center justify-center">
<img alt="Literacy Journey Illustration" class="w-40 h-40 object-cover rounded-full shadow-lg border-4 border-white" data-alt="Whimsical 3D illustration of a friendly green dragon reading a glowing book to a small fox in a forest setting with soft morning light" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCNyCYQ7VN20BmYuExO6-QfwW--CI6XcOzPaLwz172jbHayqfCabcRZLe3qqvKlzf67rZLsVRwzS8K-8iVd3qqBpoCWRgpXIlRUqYze2m7RrGpjZdnE0Fav6V5fWMwzStnzhtHK_ezXXhZjouDzoeU7ZdmLIbPR1G9CYZPaMEQF0QQTE3zFaKJ-VZjIC6N6PyeaEJ8otdLVtOXStj8Jcsb_VG-9Dl1lC7_xhSLziyVvz5Z5LqGATb9VgKqdatCLt2ys8328befFils"/>
<div class="absolute -bottom-2 -right-2 bg-secondary-container p-3 rounded-full shadow-md">
<span class="material-symbols-outlined text-on-secondary-container text-3xl">auto_stories</span>
</div>
</div>
<h1 class="font-kid-headline-lg text-kid-headline-lg text-primary tracking-tight">BrightBook</h1>
<p class="font-parent-body-sm text-parent-body-sm text-on-surface-variant max-w-[280px]">Where every page turns into a new adventure for your little one.</p>
</div>
</header>
<main class="flex-grow">
<div class="bg-white/80 backdrop-blur-sm rounded-[32px] p-6 shadow-xl border-2 border-primary-container/10">
<div class="flex bg-surface-container-low p-1.5 rounded-full mb-8">
<button class="flex-1 py-3 px-6 rounded-full font-kid-body-md text-kid-body-md bg-white text-primary shadow-sm font-bold transition-all duration-200">
            Log In
          </button>
<button class="flex-1 py-3 px-6 rounded-full font-kid-body-md text-kid-body-md text-on-surface-variant hover:text-primary transition-all duration-200">
            Sign Up
          </button>
</div>
<form class="space-y-stack-sm">
<div class="space-y-2">
<label class="block font-parent-body-sm text-parent-body-sm text-on-surface-variant px-2" for="email">Email Address</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-12 pr-4 h-[56px] rounded-2xl border-2 border-outline-variant focus:border-primary focus:ring-0 text-parent-body-sm transition-all bg-white/50" id="email" placeholder="hello@parent.com" type="email"/>
</div>
</div>
<div class="space-y-2">
<div class="flex justify-between items-center px-2">
<label class="font-parent-body-sm text-parent-body-sm text-on-surface-variant" for="password">Password</label>
<a class="font-admin-label-xs text-admin-label-xs text-primary hover:underline" href="#">Forgot?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-12 pr-4 h-[56px] rounded-2xl border-2 border-outline-variant focus:border-primary focus:ring-0 text-parent-body-sm transition-all bg-white/50" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<div class="pt-4">
<button class="w-full kid-button-3d bg-primary text-white h-[64px] rounded-2xl font-kid-headline-lg text-xl flex items-center justify-center gap-3 transition-transform" type="submit">
<span>Ready, Set, Go!</span>
<span class="material-symbols-outlined">rocket_launch</span>
</button>
</div>
</form>
<div class="mt-8 relative">
<div class="absolute inset-0 flex items-center"><div class="w-full border-t border-outline-variant/30"></div></div>
<div class="relative flex justify-center text-admin-label-xs"><span class="bg-white px-4 text-on-surface-variant">or continue with</span></div>
</div>
<div class="mt-8 grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 h-[56px] rounded-2xl border-2 border-outline-variant hover:bg-surface-container-low transition-colors">
<img alt="Google" class="w-6 h-6" data-alt="Google G logo in brand colors" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAbVW5ZR5CUj20FCCBhE4HcmNg5viOdn6zfixxdBrpQy7-wwGf_Gl1CW35S8w8Na1SX_pDFE751xgSixK5PE9p90iR3OdIufmdbke-sD8KfpkbtjeFF5v2Kt6wzfcgMJt7GTMsygNVCTO8jlvz1kVvXG1YggHZmaBK3ydOV5HiJ80noPIJbb3Gpf8VEiFFw5mONTUTMFE3tWqmf4hhMHYs3cl7uQt7RUjFIIsWRAeiOhdV3irO7FLZtXULG_JiTAtOv_me86m7r2pk"/>
<span class="font-parent-body-sm text-parent-body-sm">Google</span>
</button>
<button class="flex items-center justify-center gap-2 h-[56px] rounded-2xl border-2 border-outline-variant hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-black" data-weight="fill">ios</span>
<span class="font-parent-body-sm text-parent-body-sm">Apple</span>
</button>
</div>
</div>
</main>
<footer class="mt-12 text-center pb-8">
<p class="font-parent-body-sm text-parent-body-sm text-on-surface-variant">
        Don't have an account? <a class="text-primary font-bold" href="#">Join the magic!</a>
</p>
<div class="mt-8 flex flex-col items-center gap-4">
<div class="flex gap-4">
<a class="font-admin-label-xs text-outline hover:text-primary" href="#">Terms</a>
<a class="font-admin-label-xs text-outline hover:text-primary" href="#">Privacy</a>
<a class="font-admin-label-xs text-outline hover:text-primary" href="#">Help</a>
</div>
<div class="flex items-center gap-2 bg-primary-container/10 px-4 py-2 rounded-full">
<span class="material-symbols-outlined text-primary text-sm">verified_user</span>
<span class="font-admin-label-xs text-on-primary-container">Securely encrypted for your family</span>
</div>
</div>
</footer>
</div>
